name: Build

# yamllint disable-line rule:truthy
on:
  push:
    branches:
    - master
    - dev
    tags:
    - '*'
    paths:
    - .github/workflows/build.yml
    - Dockerfile
  pull_request:
    branches:
    - master
    - dev
    paths:
    - .github/workflows/build.yml
    - Dockerfile
  workflow_dispatch:

env:
  BRANCH: 1.99.7.2.1
  REGISTRY: ghcr.io

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      max-parallel: 2
      matrix:
        # 1. 最小改动：只保留 sqlite3 模式
        mode: [sqlite3]
    steps:
    - name: set up QEMU
      uses: docker/setup-qemu-action@v1
    - name: set up docker buildx
      uses: docker/setup-buildx-action@v1
    - name: cache build
      uses: pat-s/always-upload-cache@v2.1.5
      with:
        path: ${{ runner.temp }}/.buildx-cache
        key: ${{ runner.os }}-build-${{ matrix.mode }}-${{ hashFiles('Dockerfile') }}
        restore-keys: |
          ${{ runner.os }}-build-${{ matrix.mode }}-
    - name: checkout
      uses: actions/checkout@v2
    - name: generate container meta
      id: meta
      uses: docker/metadata-action@v3
      with:
        # 2. 修改镜像地址为 GHCR 格式
        images: ${{ env.REGISTRY }}/${{ github.repository }}
        flavor: |
          latest=true
        tags: |
          type=ref,event=branch
          type=ref,event=pr
          type=raw,value=${{ env.BRANCH }}
    - name: login to GHCR
      if: github.event_name != 'pull_request'
      uses: docker/login-action@v1
      with:
        # 3. 使用 GitHub 自动生成的 Token 登录
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: build & push
      uses: docker/build-push-action@v2
      env:
        DOCKER_BUILDKIT: 1
      with:
        build-args: |
          BRANCH=${{ env.BRANCH }}
          MODE=${{ matrix.mode }}
        push: ${{ github.event_name != 'pull_request' }}
        platforms: linux/amd64,linux/arm64 # 删除了 v7 以提高私有仓库构建速度
        labels: ${{ steps.meta.outputs.labels }}
        cache-to: type=local,mode=max,dest=${{ runner.temp }}/.buildx-cache
        cache-from: type=local,src=${{ runner.temp }}/.buildx-cache
        tags: ${{ steps.meta.outputs.tags }}
    # 4. 删除了 update DockerHub description 步骤，因为 GHCR 不支持此 Action
